# Prometheus scrape configuration for the Vyomanaut Stage 3 rig.
#
# [Added, M18 Stage 3] LTS research needs timed metrics that only real
# hardware produces. This scrapes the provider daemons' /metrics endpoints.
#
# THREE THINGS TO KNOW BEFORE YOU TRUST THIS FILE:
#
# 1. Each provider must be started with --metrics-addr=0.0.0.0:9091
#    (join.sh) or -MetricsAddr 0.0.0.0:9091 (join.ps1). The default bind is
#    127.0.0.1:9091 (NFR-026), which Prometheus on another host cannot
#    reach. That endpoint has NO authentication, so opening it is only
#    appropriate on the isolated, no-uplink rig.
#
# 2. THE COORDINATOR IS NOT SCRAPED, BECAUSE IT EXPOSES NOTHING.
#    cmd/microservice registers no /metrics handler at all — verified, not
#    assumed. So repair duration, audit cycle timing, charge computation
#    latency and every other coordinator-side measurement are NOT collected
#    by this file. What you get here is provider-side only. Closing that
#    gap is a separate piece of work; see the M18 Stage 3 handoff.
#
# 3. [Changed, Stage 3 scale-up] The target list used to be a fixed
#    static_configs block (DESK-01 through DESK-07, hardcoded IPs) — fine
#    for a 7-machine rehearsal, but two real problems show up past that:
#    a) a rig now regularly runs 10+ machines and growing, so the list
#       needs to grow with it, and b) every one of those IPs is a ZeroTier
#       address that Central hands out only once a machine actually joins
#       (guides/operator_unix_guide.md Part 5) — meaning the addresses do
#       not exist yet at the point in Part 4 where this stack starts.
#    file_sd_configs (below) solves both: it watches a plain JSON file on
#    disk and re-reads it on its own every 15s, no Prometheus restart and
#    no reload API call needed. Bring this stack up early with an empty
#    targets file, then append one line per machine as it joins. See
#    targets/README.md for the exact format.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    rig: vyomanaut-stage3

scrape_configs:
  - job_name: vyomanaut-providers
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/providers.json
        refresh_interval: 15s

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
